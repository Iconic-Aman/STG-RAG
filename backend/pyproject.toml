[project]
name = "backend"
version = "0.1.0"
description = "Edhac Clinical Guidelines RAG System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.5.0",
    "qdrant-client>=1.8.0",
    "groq>=0.5.0",
    "python-dotenv>=1.0.0",
    "laya>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
