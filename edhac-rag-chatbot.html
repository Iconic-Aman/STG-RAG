<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edhac Assistant | Ask our knowledge base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#16a34a; --green-dark:#15803d; --green-deep:#14532d;
  --mint:#ecfdf5; --mint-line:#bbf7d0; --bg:#f8fafc; --card:#fff;
  --ink:#0f172a; --muted:#475569; --line:#e2e8f0;
  --shadow:0 1px 3px rgba(15,23,42,.08);
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* top bar */
.nav{background:#fff;border-bottom:1px solid var(--line);border-top:3px solid #1e293b;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-name{font-size:32px;font-weight:600;letter-spacing:.5px;line-height:1}
.brand-tag{display:block;font-size:9px;font-weight:600;color:var(--green-dark);letter-spacing:.3px;margin-top:2px}
.nav-right{display:flex;align-items:center;gap:12px}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.btn{border-radius:6px;padding:9px 18px;font-weight:500;font-size:15px;border:1px solid var(--green)}
.btn-outline{background:#fff;color:var(--green-dark)}
.btn-solid{background:var(--green);color:#fff}
.btn-solid:hover{background:var(--green-dark)}

/* layout */
.page{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;max-width:1280px;width:100%;margin:0 auto;padding:28px}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.chat-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.icon-box{width:44px;height:44px;border-radius:8px;background:var(--green);display:grid;place-items:center;flex:none}
.icon-box svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat-head h1{font-size:26px;font-weight:700;line-height:1.2}
.chat-head p{font-size:14px;color:var(--muted)}

/* messages */
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;max-width:88%}
.row.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--green);flex:none;display:grid;place-items:center}
.avatar svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bubble{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;white-space:pre-wrap;word-wrap:break-word}
.row.user .bubble{background:var(--green);color:#fff;border-color:var(--green)}
.row.bot .bubble{background:var(--bg)}
.cite{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin:0 2px;border-radius:5px;background:var(--mint);border:1px solid var(--mint-line);color:var(--green-dark);font-size:12px;font-weight:600;cursor:pointer;vertical-align:baseline}
.cite:hover{background:var(--mint-line)}
.sources{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.src{background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:6px;padding:8px 12px;font-size:14px}
.src.flash{background:var(--mint)}
.src b{font-weight:600}
.src small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.src .score{float:right;font-size:12px;color:var(--green-dark);font-weight:600}
.src-label{font-size:13px;font-weight:600;color:var(--muted);margin-top:12px}
.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--green);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}

/* suggestions + input */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 14px}
.chip{background:#fff;border:1px solid var(--mint-line);color:var(--green-dark);border-radius:999px;padding:7px 14px;font-size:14px}
.chip:hover{background:var(--mint)}
.composer{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;max-height:140px;background:#fff;color:var(--ink)}
.composer textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.send{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:8px;padding:0 20px;font-weight:600;font-size:16px;box-shadow:0 4px 10px rgba(22,163,74,.25)}
.send:hover{background:var(--green-dark)}
.send:disabled{opacity:.5;cursor:not-allowed}
.send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sidebar */
.side{display:flex;flex-direction:column;gap:20px;min-height:0;overflow-y:auto}
.kb{background:linear-gradient(180deg,var(--mint),#f0fdf4);border:2px solid var(--mint-line);border-radius:10px;padding:22px}
.kb h2{font-size:22px;font-weight:700;margin-bottom:6px}
.kb p{color:var(--muted);font-size:15px;margin-bottom:16px}
.drop{display:block;border:2px dashed #86efac;border-radius:8px;background:#fff;text-align:center;padding:18px 12px;cursor:pointer;color:var(--green-dark);font-weight:600;font-size:15px}
.drop:hover,.drop.over{background:var(--mint)}
.drop small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.drop input{display:none}
.docs{list-style:none;padding:0;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.docs li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.docs .icon-sm{width:30px;height:30px;border-radius:6px;background:var(--green);display:grid;place-items:center;flex:none}
.docs .icon-sm svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.docs .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs .st{font-size:12px;color:var(--green-dark);font-weight:600}
.settings{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.settings h3{font-size:17px;font-weight:700;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px}
.field input[type=text]:focus{outline:none;border-color:var(--green)}
.field input[type=range]{width:100%;accent-color:var(--green)}
.mode{font-size:13px;color:var(--muted)}
.mode b{color:var(--green-dark)}

@media (max-width:960px){
  body{height:auto}
  .page{grid-template-columns:1fr;padding:16px}
  .chat{height:75vh}
  .nav{padding:0 16px}.status{display:none}.brand-name{font-size:26px}
  .row{max-width:96%}
}
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="#">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M15 4h10v11h11v10H25v11H15V25H4V15h11z" fill="#16a34a"/><path d="M30 6c-8 2-12 8-12 16" stroke="#84cc16" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
    <span><span class="brand-name">edhac</span><span class="brand-tag">TRANSFORMING PATIENT CARE</span></span>
  </a>
  <div class="nav-right">
    <span class="status"><span class="dot"></span><span id="statusText">Knowledge base ready</span></span>
    <button class="btn btn-outline" id="clearBtn">Clear chat</button>
    <button class="btn btn-solid" id="newDocBtn">Add documents</button>
  </div>
</header>

<main class="page">
  <section class="chat" aria-label="Chat">
    <div class="chat-head">
      <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg></div>
      <div>
        <h1>Ask Edhac</h1>
        <p>Answers come from your documents, with sources shown.</p>
      </div>
    </div>

    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask a question about your documents..." aria-label="Your question"></textarea>
      <button class="send" id="send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>Send</button>
    </div>
  </section>

  <aside class="side">
    <div class="kb">
      <h2>Your knowledge base</h2>
      <p>Upload the documents the assistant should answer from.</p>
      <label class="drop" id="drop">
        Drop files or click to upload
        <small>PDF, DOCX, TXT, MD</small>
        <input type="file" id="file" multiple accept=".pdf,.docx,.txt,.md">
      </label>
      <ul class="docs" id="docs"></ul>
    </div>

    <div class="settings">
      <h3>Retrieval settings</h3>
      <div class="field">
        <label for="api">RAG API URL</label>
        <input type="text" id="api" placeholder="https://your-server.com/api">
      </div>
      <div class="field">
        <label for="topk">Sources per answer: <span id="topkVal">3</span></label>
        <input type="range" id="topk" min="1" max="6" value="3">
      </div>
      <p class="mode" id="mode">Mode: <b>Demo</b> (sample data, no server)</p>
    </div>
  </aside>
</main>

<script>
/* ============ CONFIG ============
   Leave API URL empty to run in demo mode.
   Your backend should expose:
     POST {API}/chat    body: {query, top_k, history:[{role,content}]}
                        returns: {answer, sources:[{title, snippet, score}]}
                        (use [1], [2] in the answer to cite sources in order)
     POST {API}/upload  multipart form-data, field "files"
*/
const DEFAULT_API = "";

/* Demo knowledge base (benefits from the careers page) */
const DEMO_DOCS = [
  {title:"Compensation", text:"Competitive salary with equity participation for all full-time team members."},
  {title:"Health benefits", text:"Premium health, dental, and vision insurance is provided for employees."},
  {title:"Work schedule", text:"Flexible work schedule and unlimited PTO so people can manage their time and wellbeing."},
  {title:"Tools & hardware", text:"Latest hardware and software tools are provided to every engineer and researcher."},
  {title:"Conferences", text:"Conference attendance and speaking opportunities are supported across the team."},
  {title:"Research & patents", text:"Research publication support and patent incentives for work that advances patient care."},
  {title:"Culture", text:"A collaborative and innovation-focused work environment built around transforming patient care."},
  {title:"AI resources", text:"Access to cutting-edge AI research and datasets for approved projects."}
];
const SUGGESTIONS = ["What health insurance do you offer?","Is there unlimited PTO?","Do you support research publications?","What AI resources can I use?"];

const $ = id => document.getElementById(id);
const msgs=$("msgs"), input=$("input"), sendBtn=$("send");
const history=[];
const icons={
  bot:'<svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>',
  file:'<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>'
};

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const apiUrl = () => $("api").value.trim().replace(/\/$/,"");
function updateMode(){
  $("mode").innerHTML = apiUrl() ? "Mode: <b>Live</b> (connected to your API)" : "Mode: <b>Demo</b> (sample data, no server)";
}
function scroll(){ msgs.scrollTop = msgs.scrollHeight; }

function addUser(text){
  const r=document.createElement("div"); r.className="row user";
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  r.appendChild(b); msgs.appendChild(r); scroll();
}
function addBot(html, sources){
  const r=document.createElement("div"); r.className="row bot";
  const a=document.createElement("div"); a.className="avatar"; a.innerHTML=icons.bot;
  const b=document.createElement("div"); b.className="bubble";
  const id="m"+Date.now()+Math.random().toString(36).slice(2,6);
  b.innerHTML = html.replace(/\[(\d+)\]/g,(m,n)=>`<button class="cite" data-t="${id}-${n}" aria-label="Source ${n}">${n}</button>`);
  if(sources && sources.length){
    let s=`<div class="src-label">Sources</div><div class="sources">`;
    sources.forEach((x,i)=>{
      s+=`<div class="src" id="${id}-${i+1}">${x.score!=null?`<span class="score">${Math.round(x.score*100)}% match</span>`:""}<b>${i+1}. ${esc(x.title||"Document")}</b><small>${esc(x.snippet||"")}</small></div>`;
    });
    b.insertAdjacentHTML("beforeend", s+"</div>");
  }
  r.append(a,b); msgs.appendChild(r); scroll();
  b.querySelectorAll(".cite").forEach(c=>c.onclick=()=>{
    const t=$(c.dataset.t); if(!t) return;
    t.classList.add("flash"); t.scrollIntoView({block:"nearest",behavior:"smooth"});
    setTimeout(()=>t.classList.remove("flash"),1200);
  });
}
function showTyping(){
  const r=document.createElement("div"); r.className="row bot"; r.id="typing";
  r.innerHTML=`<div class="avatar">${icons.bot}</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  msgs.appendChild(r); scroll();
}
const hideTyping=()=>{const t=$("typing"); if(t) t.remove();};

/* ---------- demo retrieval (keyword overlap) ---------- */
function demoRetrieve(q,k){
  const words=q.toLowerCase().match(/[a-z]{3,}/g)||[];
  const stop=new Set(["the","and","for","you","are","what","does","have","with","can","your","there","about","any","how"]);
  const terms=words.filter(w=>!stop.has(w));
  return DEMO_DOCS.map(d=>{
    const hay=(d.title+" "+d.text).toLowerCase();
    const hits=terms.filter(t=>hay.includes(t.slice(0,Math.max(4,t.length-2)))).length;
    return {...d,score:terms.length?Math.min(.99,hits/terms.length*.9+.05):0};
  }).filter(d=>d.score>.2).sort((a,b)=>b.score-a.score).slice(0,k)
    .map(d=>({title:d.title,snippet:d.text,score:d.score}));
}
async function demoAnswer(q,k){
  await new Promise(r=>setTimeout(r,700));
  const src=demoRetrieve(q,k);
  if(!src.length) return {answer:"I couldn't find that in your documents. Try rephrasing, or upload a document that covers it.",sources:[]};
  return {answer:"Here is what the documents say: "+src.map((s,i)=>s.snippet+" ["+(i+1)+"]").join(" "),sources:src};
}

/* ---------- live API ---------- */
async function liveAnswer(q,k){
  const res=await fetch(apiUrl()+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:q,top_k:k,history:history.slice(-8)})});
  if(!res.ok) throw new Error("Server returned "+res.status);
  return res.json();
}

/* ---------- send ---------- */
async function ask(q){
  q=q.trim(); if(!q) return;
  $("chips").style.display="none";
  addUser(q); input.value=""; input.style.height="auto";
  sendBtn.disabled=true; showTyping();
  const k=+$("topk").value;
  try{
    const out = apiUrl()? await liveAnswer(q,k) : await demoAnswer(q,k);
    hideTyping();
    addBot(esc(out.answer||"No answer returned."), out.sources);
    history.push({role:"user",content:q},{role:"assistant",content:out.answer||""});
  }catch(e){
    hideTyping();
    addBot("I couldn't reach the RAG server. Check the API URL in Retrieval settings and make sure the server is running and allows requests from this page (CORS).");
  }
  sendBtn.disabled=false; input.focus();
}

/* ---------- documents ---------- */
function addDocItem(name,status){
  const li=document.createElement("li");
  li.innerHTML=`<span class="icon-sm">${icons.file}</span><span class="nm"></span><span class="st"></span>`;
  li.querySelector(".nm").textContent=name; li.querySelector(".st").textContent=status;
  $("docs").appendChild(li); return li;
}
async function handleFiles(files){
  for(const f of files){
    const li=addDocItem(f.name,"Uploading");
    if(apiUrl()){
      try{
        const fd=new FormData(); fd.append("files",f);
        const r=await fetch(apiUrl()+"/upload",{method:"POST",body:fd});
        li.querySelector(".st").textContent = r.ok?"Indexed":"Failed";
      }catch{ li.querySelector(".st").textContent="Failed"; }
    }else{
      await new Promise(r=>setTimeout(r,500));
      li.querySelector(".st").textContent="Demo only";
    }
  }
}

/* ---------- wiring ---------- */
sendBtn.onclick=()=>ask(input.value);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(input.value);} });
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px";});
$("file").onchange=e=>{handleFiles([...e.target.files]);e.target.value="";};
$("newDocBtn").onclick=()=>$("file").click();
const drop=$("drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>handleFiles([...e.dataTransfer.files]));
$("topk").oninput=e=>$("topkVal").textContent=e.target.value;
$("api").oninput=updateMode;
$("clearBtn").onclick=()=>{msgs.innerHTML="";history.length=0;$("chips").style.display="flex";greet();};

function greet(){
  addBot("Hi, I'm the Edhac assistant. Ask me anything about the documents in your knowledge base and I'll answer with sources.");
}
SUGGESTIONS.forEach(s=>{
  const b=document.createElement("button"); b.className="chip"; b.textContent=s; b.onclick=()=>ask(s);
  $("chips").appendChild(b);
});
$("api").value=DEFAULT_API; updateMode();
DEMO_DOCS.slice(0,3).forEach(d=>addDocItem(d.title+".txt","Demo"));
greet();
</script>
</body>
</html>
